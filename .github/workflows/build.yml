name: Build VR Notes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -q VR-Notes-Cloud-Build.zip -d build-src

      - name: Fix Java and Kotlin targets
        run: |
          cd build-src/VR-Notes-Cloud-Build/VR-Notes
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              'compileOptions {',
              'compileOptions {\\n        sourceCompatibility JavaVersion.VERSION_17\\n        targetCompatibility JavaVersion.VERSION_17'
          )

          s = s.replace(
              'kotlinOptions {',
              'kotlinOptions {\\n        jvmTarget = "17"'
          )

          s = s.replace(
              'android {',
              'android {\\n    compileOptions {\\n        sourceCompatibility JavaVersion.VERSION_17\\n        targetCompatibility JavaVersion.VERSION_17\\n    }',
              1
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd build-src/VR-Notes-Cloud-Build/VR-Notes
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Notes-APK
          path: build-src/VR-Notes-Cloud-Build/VR-Notes/app/build/outputs/apk/debug/app-debug.apk
