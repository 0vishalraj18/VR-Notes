name: Build VR Notes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -q VR-Notes-Cloud-Build.zip -d build-src

      - name: Build APK
        run: |
          cd build-src/VR-Notes-Cloud-Build/VR-Notes
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Notes-APK
          path: build-src/VR-Notes-Cloud-Build/VR-Notes/app/build/outputs/apk/debug/app-debug.apk
