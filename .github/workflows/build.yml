name: Build VR Notes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          unzip -q VR-Notes-Cloud-Build.zip -d build-src

      - name: Fix app build file
        run: |
          cd build-src/VR-Notes-Cloud-Build/VR-Notes
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.vrnotes.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vrnotes.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        run: |
          cd build-src/VR-Notes-Cloud-Build/VR-Notes
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Notes-APK
          path: build-src/VR-Notes-Cloud-Build/VR-Notes/app/build/outputs/apk/debug/app-debug.apk
